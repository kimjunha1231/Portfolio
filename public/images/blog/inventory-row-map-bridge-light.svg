<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">원천 키와 canonical PK를 잇는 승인 매핑</title>
  <desc id="desc">원천 current 행의 키를 row map이 canonical PK와 연결하고, 매핑 누락이나 중복은 publish 전에 중단하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7894b7"/></marker><style>.title{font:800 36px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}.subtitle{font:500 21px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#61728c}.label{font:800 25px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}.body{font:500 18px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#536780}.mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#60738e}.line{stroke:#7894b7;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="650" fill="#fbfcff"/><rect x="28" y="28" width="1544" height="594" rx="32" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
  <text x="72" y="82" class="title">이름이 아니라, 승인된 연결 지도로 대상을 찾습니다</text><text x="74" y="116" class="subtitle">원천 키와 canonical PK를 분리해 잘못된 재고 연결을 publish 전에 막습니다.</text>
  <rect x="74" y="205" width="360" height="164" rx="20" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2"/><text x="112" y="251" class="label">원천 current 행</text><text x="112" y="293" class="mono">OFFLINE:DEPT_X:</text><text x="112" y="322" class="mono">SKU-1:LOT-7</text><text x="112" y="356" class="body">source_record_key</text><path d="M434 287H548" class="line"/>
  <rect x="552" y="154" width="440" height="266" rx="22" fill="#f2edff" stroke="#c8baf5" stroke-width="2.5"/><text x="594" y="202" class="label">승인된 연결 지도</text><text x="594" y="248" class="mono">product_id · sku_id</text><text x="594" y="278" class="mono">sales_point_id · warehouse_id</text><text x="594" y="308" class="mono">lot_id · inventory_balance_id</text><text x="594" y="338" class="mono">mapping_status = MAPPED</text><text x="594" y="382" class="body">한 원천 행을 여러 canonical PK에 연결</text><path d="M992 287H1102" class="line"/>
  <rect x="1106" y="154" width="380" height="266" rx="22" fill="#eaf2ff" stroke="#9dbdec" stroke-width="2.5"/><text x="1146" y="202" class="label">기존 canonical 행</text><text x="1146" y="248" class="mono">PRODUCT · SKU · LOT</text><text x="1146" y="278" class="mono">INVENTORY_BALANCE</text><text x="1146" y="308" class="mono">PRICE · POLICY</text><text x="1146" y="360" class="body">매핑된 기존 행만 갱신</text>
  <rect x="384" y="484" width="830" height="74" rx="18" fill="#fff2f0" stroke="#efaaa4" stroke-width="2"/><text x="418" y="528" class="label" style="font-size:22px">매핑 누락 · 필수 PK 없음 · 중복 target</text><text x="1000" y="528" class="body" style="font-size:17px">→ fail-closed · publish 중단</text>
</svg>
