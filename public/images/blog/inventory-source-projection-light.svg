<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">원천 컬럼을 공통 필드로 번역하는 매핑표</title>
  <desc id="desc">오프라인, 이커머스, 그리팅, 물류센터의 서로 다른 가용 수량 컬럼을 on_hand_qty라는 공통 필드로 맞추고 typed record가 검증하는 과정</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7894b7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#90a4c0" flood-opacity=".16"/></filter>
    <style>
      .title{font:800 36px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}
      .subtitle{font:500 21px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#61728c}
      .head{font:800 19px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#425572}
      .label{font:800 22px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}
      .body{font:500 18px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#536780}
      .mono{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#60738e}
      .line{stroke:#7894b7;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="780" fill="#fbfcff"/>
  <rect x="28" y="28" width="1544" height="724" rx="32" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
  <text x="72" y="82" class="title">컬럼이 달라도, 공통 필드로 번역합니다</text>
  <text x="74" y="116" class="subtitle">이번 단계의 핵심은 흐름보다 ‘어떤 값이 어떤 의미로 바뀌는가’를 확인하는 일입니다.</text>

  <rect x="74" y="158" width="1072" height="54" rx="14" fill="#f0f4fa"/>
  <text x="112" y="193" class="head">원천</text>
  <text x="386" y="193" class="head">원천 컬럼</text>
  <text x="744" y="193" class="head">공통 의미</text>
  <text x="1014" y="193" class="head">변환 규칙</text>

  <rect x="74" y="226" width="1072" height="82" rx="16" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2"/>
  <circle cx="112" cy="267" r="14" fill="#3fa77e"/>
  <text x="144" y="274" class="label">오프라인</text>
  <text x="386" y="274" class="mono">available_stock_count</text>
  <path d="M644 267H720" class="line"/>
  <text x="744" y="274" class="mono">on_hand_qty</text>
  <text x="1014" y="274" class="body">이름만 변경</text>

  <rect x="74" y="322" width="1072" height="82" rx="16" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2"/>
  <circle cx="112" cy="363" r="14" fill="#3fa77e"/>
  <text x="144" y="370" class="label">이커머스</text>
  <text x="386" y="370" class="mono">sellable_quantity</text>
  <path d="M644 363H720" class="line"/>
  <text x="744" y="370" class="mono">on_hand_qty</text>
  <text x="1014" y="370" class="body">판매 가능 수량</text>

  <rect x="74" y="418" width="1072" height="82" rx="16" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2"/>
  <circle cx="112" cy="459" r="14" fill="#3fa77e"/>
  <text x="144" y="466" class="label">그리팅</text>
  <text x="386" y="466" class="mono">saleable_meal_count</text>
  <path d="M644 459H720" class="line"/>
  <text x="744" y="466" class="mono">on_hand_qty</text>
  <text x="1014" y="466" class="body">식수 단위 → 수량</text>

  <rect x="74" y="514" width="1072" height="82" rx="16" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2"/>
  <circle cx="112" cy="555" r="14" fill="#3fa77e"/>
  <text x="144" y="562" class="label">물류센터</text>
  <text x="386" y="562" class="mono">physical_available_qty</text>
  <path d="M644 555H720" class="line"/>
  <text x="744" y="562" class="mono">on_hand_qty</text>
  <text x="1014" y="562" class="body">공용 물리 수량</text>

  <rect x="1180" y="226" width="306" height="370" rx="22" fill="#fff4e3" stroke="#f0b465" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="1216" y="260" width="64" height="64" rx="16" fill="#e7891f"/>
  <path d="M1234 278h28M1234 294h28M1234 310h28" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="1300" y="288" class="label">공통 record</text>
  <text x="1216" y="370" class="mono">on_hand_qty</text>
  <text x="1216" y="405" class="mono">reserved_qty</text>
  <text x="1216" y="440" class="mono">expiry_date</text>
  <text x="1216" y="475" class="mono">sale_available_yn</text>
  <path d="M1146 410H1172" class="line"/>
  <rect x="1216" y="514" width="234" height="46" rx="12" fill="#fff" stroke="#f0c98f" stroke-width="1.5"/>
  <text x="1237" y="544" class="body">typed validation</text>

  <rect x="74" y="638" width="1412" height="70" rx="18" fill="#eaf2ff" stroke="#9dbdec" stroke-width="2"/>
  <text x="110" y="681" class="label">필드 변환</text>
  <text x="274" y="681" class="body">SQL projection이 컬럼과 타입을 맞추고, record 생성자가 ID·수량·날짜의 최소 조건을 검사합니다.</text>
</svg>
