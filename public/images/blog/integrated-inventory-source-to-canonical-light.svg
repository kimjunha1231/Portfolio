<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">서로 다른 원천을 같은 기준으로 맞추는 과정</title>
  <desc id="desc">오프라인, 이커머스, 그리팅, 물류센터 재고를 공통 번역기와 검증 매핑을 거쳐 상품, SKU, LOT, 정책, 재고, 위험평가로 연결하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7692b5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#90a4c0" flood-opacity=".18"/></filter>
    <style>
      .title{font:800 36px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}
      .subtitle{font:500 21px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#61728c}
      .label{font:800 25px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}
      .body{font:500 18px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#536780}
      .mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#60738e}
      .source{fill:#e9f7f1;stroke:#9dd9bd;stroke-width:2}
      .orange{fill:#fff4e3;stroke:#f0b465;stroke-width:2.5}
      .blue{fill:#eaf2ff;stroke:#9dbdec;stroke-width:2.5}
      .purple{fill:#f2edff;stroke:#c8baf5;stroke-width:2}
      .line{stroke:#7894b7;stroke-width:3.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#fbfcff"/>
  <rect x="28" y="28" width="1544" height="664" rx="32" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
  <text x="72" y="82" class="title">서로 다른 원천을 같은 기준으로 맞추는 과정</text>
  <text x="74" y="116" class="subtitle">테이블을 하나로 합치는 대신, 각 원천의 의미를 공통 형식으로 번역합니다.</text>

  <text x="78" y="166" class="body">서로 다른 원천</text>
  <rect x="74" y="190" width="360" height="92" rx="18" class="source" filter="url(#shadow)"/>
  <circle cx="116" cy="236" r="22" fill="#3fa77e"/>
  <text x="157" y="228" class="label">오프라인 재고</text><text x="157" y="257" class="mono">available_stock_count</text>
  <rect x="74" y="300" width="360" height="92" rx="18" class="source" filter="url(#shadow)"/>
  <circle cx="116" cy="346" r="22" fill="#3fa77e"/>
  <text x="157" y="338" class="label">이커머스 재고</text><text x="157" y="367" class="mono">sellable_quantity</text>
  <rect x="74" y="410" width="360" height="92" rx="18" class="source" filter="url(#shadow)"/>
  <circle cx="116" cy="456" r="22" fill="#3fa77e"/>
  <text x="157" y="448" class="label">그리팅 재고</text><text x="157" y="477" class="mono">saleable_meal_count</text>
  <rect x="74" y="520" width="360" height="92" rx="18" class="source" filter="url(#shadow)"/>
  <circle cx="116" cy="566" r="22" fill="#3fa77e"/>
  <text x="157" y="558" class="label">물류센터 재고</text><text x="157" y="587" class="mono">physical_available_qty</text>

  <path d="M434 236C492 236 492 330 560 330M434 346H560M434 456C492 456 492 362 560 362M434 566C492 566 492 394 560 394" class="line"/>
  <rect x="563" y="224" width="360" height="250" rx="24" class="orange" filter="url(#shadow)"/>
  <rect x="597" y="267" width="66" height="66" rx="18" fill="#e7891f"/>
  <path d="M615 284h30M615 300h30M615 316h30" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="687" y="289" class="label">공통 번역기</text>
  <text x="687" y="322" class="body">SQL projection</text>
  <text x="687" y="350" class="body">+ typed validation</text>
  <text x="600" y="409" class="mono" style="fill:#af6a16">가용 수량 → on_hand_qty</text>
  <text x="600" y="438" class="body">서로 다른 이름을 같은 의미로 맞춥니다.</text>

  <path d="M923 349H1010" class="line"/>
  <rect x="1012" y="224" width="290" height="250" rx="24" class="blue" filter="url(#shadow)"/>
  <circle cx="1064" cy="294" r="28" fill="#3575c5"/><path d="M1049 294h30M1064 279v30" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="1108" y="300" class="label">검증·매핑</text>
  <text x="1048" y="358" class="body">row map</text><text x="1048" y="387" class="body">필수값 검사</text><text x="1048" y="416" class="body">중복·충돌 확인</text>
  <text x="1048" y="449" class="mono">잘못된 연결은 중단</text>
  <path d="M1302 349H1374" class="line"/>

  <rect x="1378" y="188" width="156" height="68" rx="16" class="purple"/><text x="1400" y="230" class="label" style="font-size:20px">상품 · SKU</text>
  <rect x="1378" y="278" width="156" height="68" rx="16" class="purple"/><text x="1400" y="320" class="label" style="font-size:20px">LOT · 정책</text>
  <rect x="1378" y="368" width="156" height="68" rx="16" class="purple"/><text x="1393" y="410" class="label" style="font-size:20px">재고 · 위험평가</text>
  <text x="1379" y="474" class="body" style="font-size:16px">기존 canonical 테이블</text>

  <rect x="72" y="646" width="1462" height="26" rx="13" fill="#f0f4fa"/>
  <text x="800" y="665" text-anchor="middle" class="body">핵심은 테이블을 하나로 합치는 것이 아니라, 서로 다른 표현을 같은 의미로 번역하는 것입니다.</text>
</svg>
