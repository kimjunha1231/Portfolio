<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">초기 fixture를 만드는 순서</title>
  <desc id="desc">승인된 snapshot 여섯 개를 읽고 원천을 선택해 serializer와 row map, manifest를 만든 뒤 source current에 적재하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7894b7"/></marker><style>.title{font:800 36px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}.subtitle{font:500 21px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#61728c}.label{font:800 24px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}.body{font:500 18px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#536780}.mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#60738e}.line{stroke:#7894b7;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="760" fill="#fbfcff"/><rect x="28" y="28" width="1544" height="704" rx="32" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
  <text x="72" y="82" class="title">초기 fixture는 canonical에서 거꾸로 만듭니다</text><text x="74" y="116" class="subtitle">실제 sync와 반대 방향으로 기준 데이터를 만들기 때문에 첫 sync가 no-op이 됩니다.</text>
  <rect x="74" y="190" width="332" height="190" rx="22" fill="#eaf2ff" stroke="#9dbdec" stroke-width="2.5"/><text x="110" y="238" class="label">승인 snapshot 6종</text><text x="110" y="279" class="mono">master · price · cost</text><text x="110" y="309" class="mono">lot · policy · balance</text><text x="110" y="352" class="body">행 수 · checksum · 기준 시각</text><path d="M406 285H510" class="line"/>
  <rect x="514" y="156" width="380" height="258" rx="22" fill="#fff4e3" stroke="#f0b465" stroke-width="2.5"/><text x="554" y="207" class="label">fixture generator</text><text x="554" y="250" class="body">키 기반 snapshot 조인</text><text x="554" y="280" class="body">원천별 serializer</text><text x="554" y="310" class="body">round-trip 검증</text><text x="554" y="361" class="mono" style="fill:#af6a16">record_hash + generation_id</text><path d="M894 285H1000" class="line"/>
  <rect x="1004" y="190" width="410" height="190" rx="22" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2.5"/><text x="1044" y="238" class="label">원천 current 4종</text><text x="1044" y="279" class="body">오프라인 · 이커머스</text><text x="1044" y="309" class="body">그리팅 · 물류센터</text><text x="1044" y="352" class="mono">source_record_key 기준</text>
  <path d="M274 380V488M704 414V488M1209 380V488" class="line"/>
  <rect x="74" y="492" width="332" height="142" rx="20" fill="#f2edff" stroke="#c8baf5" stroke-width="2"/><text x="110" y="538" class="label">row map</text><text x="110" y="577" class="mono">source key → canonical PK</text><text x="110" y="608" class="body">MAPPED 상태만 publish 대상</text>
  <rect x="514" y="492" width="380" height="142" rx="20" fill="#f7f9fd" stroke="#d6e0ed" stroke-width="2"/><text x="554" y="538" class="label">generation manifest</text><text x="554" y="577" class="mono">입력·출력 checksum</text><text x="554" y="608" class="body">재생성 결과를 검증</text>
  <rect x="1004" y="492" width="410" height="142" rx="20" fill="#eaf2ff" stroke="#9dbdec" stroke-width="2"/><text x="1044" y="538" class="label">MERGE loader</text><text x="1044" y="577" class="body">source + row map + state</text><text x="1044" y="608" class="mono">첫 sync changed = 0</text>
  <rect x="74" y="672" width="1340" height="24" rx="12" fill="#f0f4fa"/><text x="744" y="690" text-anchor="middle" class="body">초기 생성 방향: canonical snapshot → source current · 실제 동기화 방향: source current → canonical</text>
</svg>
