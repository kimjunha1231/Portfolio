<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">canonical 커밋 뒤 대시보드와 통계 스냅샷 흐름</title>
  <desc id="desc">canonical과 위험 판정 게시가 끝난 뒤 변경 여부에 따라 스냅샷 작업을 저장하고, 커밋 이후 독립 실행한 다음 프론트엔드가 준비된 집계만 갱신하는 과정</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .note { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .decision { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .arrow { stroke: #3b82f6; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="430" rx="28" fill="#f8fafc"/>
  <text x="44" y="54" class="title">canonical 커밋 뒤 스냅샷 실행 순서</text>
  <text x="44" y="82" class="note">재고 반영과 대시보드·통계 집계를 서로 다른 작업으로 다루는 이유</text>

  <rect x="55" y="155" width="190" height="82" rx="16" class="box"/>
  <text x="150" y="188" text-anchor="middle" class="label">canonical·LOT·위험</text>
  <text x="150" y="214" text-anchor="middle" class="label">publish</text>

  <line x1="245" y1="196" x2="330" y2="196" class="arrow"/>
  <text x="287" y="181" text-anchor="middle" class="note">변경 여부</text>

  <polygon points="405,135 490,196 405,257 320,196" class="decision"/>
  <text x="405" y="191" text-anchor="middle" class="label">변경</text>
  <text x="405" y="215" text-anchor="middle" class="label">있음?</text>

  <line x1="490" y1="196" x2="585" y2="196" class="arrow"/>
  <text x="537" y="181" text-anchor="middle" class="note">예</text>
  <rect x="585" y="155" width="200" height="82" rx="16" class="box"/>
  <text x="685" y="188" text-anchor="middle" class="label">dashboard task</text>
  <text x="685" y="214" text-anchor="middle" class="label">statistics task 저장</text>

  <line x1="785" y1="196" x2="875" y2="196" class="arrow"/>
  <text x="830" y="181" text-anchor="middle" class="note">트랜잭션 commit</text>
  <rect x="875" y="155" width="180" height="82" rx="16" class="box"/>
  <text x="965" y="188" text-anchor="middle" class="label">각 task 독립 실행</text>
  <text x="965" y="214" text-anchor="middle" class="label">READY / FAILED</text>

  <line x1="1055" y1="196" x2="1135" y2="196" class="arrow"/>
  <rect x="1135" y="155" width="100" height="82" rx="16" class="box"/>
  <text x="1185" y="188" text-anchor="middle" class="label">준비된</text>
  <text x="1185" y="214" text-anchor="middle" class="label">집계 갱신</text>

  <line x1="405" y1="257" x2="405" y2="328" class="arrow"/>
  <text x="428" y="298" class="note">아니오</text>
  <rect x="320" y="328" width="170" height="58" rx="14" class="box"/>
  <text x="405" y="363" text-anchor="middle" class="label">task·자동 재조회 생략</text>
</svg>
