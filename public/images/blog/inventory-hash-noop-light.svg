<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">변경된 행만 반영하는 hash 비교</title>
  <desc id="desc">record_hash와 synced_record_hash가 다를 때만 변경 후보를 buffer와 MERGE로 보내고 같은 값이면 건너뛰어 첫 sync no-op을 확인하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7894b7"/></marker><style>.title{font:800 36px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}.subtitle{font:500 21px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#61728c}.label{font:800 24px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#1b2b45}.body{font:500 18px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#536780}.mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#60738e}.line{stroke:#7894b7;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#9db0c7;stroke-width:2.2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="650" fill="#fbfcff"/><rect x="28" y="28" width="1544" height="594" rx="32" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
  <text x="72" y="82" class="title">같은 값은 건너뛰고, 바뀐 값만 반영합니다</text><text x="74" y="116" class="subtitle">hash는 최종 결과가 아니라 publish 후보를 줄이는 변경 기준입니다.</text>
  <rect x="74" y="222" width="320" height="146" rx="20" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2"/><text x="112" y="266" class="label">원천 current</text><text x="112" y="306" class="mono">record_hash</text><text x="112" y="334" class="mono">synced_record_hash</text><path d="M394 295H490" class="line"/>
  <path d="M600 186L708 295L600 404L492 295Z" fill="#fff4e3" stroke="#f0b465" stroke-width="2.5"/><text x="554" y="285" class="label" style="font-size:21px">hash가</text><text x="545" y="316" class="label" style="font-size:21px">다른가?</text>
  <path d="M708 295H810" class="line"/><rect x="814" y="212" width="310" height="166" rx="20" fill="#eaf2ff" stroke="#9dbdec" stroke-width="2.5"/><text x="850" y="260" class="label">변경 있음</text><text x="850" y="301" class="mono">buffer에 추가</text><text x="850" y="332" class="mono">MERGE → canonical</text><path d="M1124 295H1236" class="line"/><rect x="1240" y="212" width="250" height="166" rx="20" fill="#f2edff" stroke="#c8baf5" stroke-width="2"/><text x="1280" y="260" class="label">publish</text><text x="1280" y="301" class="body">상품 · LOT · 재고</text><text x="1280" y="332" class="body">target별 반영</text>
  <path d="M600 404V482" class="dash"/><rect x="434" y="490" width="380" height="68" rx="18" fill="#e9f7f1" stroke="#9dd9bd" stroke-width="2"/><text x="474" y="532" class="label" style="font-size:21px">같은 값 → 건너뜀</text>
  <text x="912" y="504" class="body">canonical snapshot으로 만든 fixture는</text><text x="912" y="540" class="label" style="font-size:22px">첫 sync changed = 0</text>
</svg>
