name: Automated SEO Verification & Search Engine Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  seo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify SEO Quality
        run: npm run verify:seo

      - name: Push to Search Engines (Google & Naver/IndexNow)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: npm run seo:push
